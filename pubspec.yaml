name: kilo_app
description: Recomendador de compras de insumos por voz para restaurantes de Lima.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  cupertino_icons: ^1.0.9
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/supplies/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/brand/icon_1024.png
    background_color: "#F8FAFC"
    theme_color: "#2563EB"
  image_path: assets/brand/icon_1024.png
  remove_alpha_ios: true
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: assets/brand/android_foreground.png
  adaptive_icon_monochrome: assets/brand/android_monochrome.png

flutter_native_splash:
  color: "#F8FAFC"
  image: assets/brand/kilo_symbol.png
  android_12:
    color: "#F8FAFC"
    image: assets/brand/splash_android12.png
  web: false
